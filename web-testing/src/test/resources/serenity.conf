webdriver {
  driver = chrome
  autodownload = true
}

headless.mode = false

serenity {
  project.name = "AlterraShop Web UI Testing"
  take.screenshots = FOR_FAILURES
  browser.maximized = true
}

environments {
  default {
    webdriver.base.url = "https://alta.id"
  }
  staging {
    webdriver.base.url = "https://staging.alta.id"
  }
}
